# ===========================================================================
# kitty.conf — "Caelestia" style (palette extracted from the Caelestia scheme)
# ! Adapted for KDE Plasma:
#   - kitty has ITS OWN transparency (background only, sharp text) to stand out
#   - the KWin rule "Transparent_windows" (90%) adds to it -> combined effect
#   - the blur behind is done by KWin (better-blur-dx); kitty also requests it
#     natively via ext_background_effect
# ===========================================================================

# --- Font ---
font_family              JetBrains Mono Nerd Font
font_size                10.0
adjust_line_height       0

# --- Transparency + blur ---
# kitty opacity (background only, text stays sharp) which ADDS UP with the
# 90% of the KWin rule -> kitty ends up more transparent than Konsole/the others.
# Tuning: 0.85 = very noticeable, 0.95 = subtle. Reload: kill -USR1 <kitty pid>
background_opacity       0.95
dynamic_background_opacity yes

# Native blur (Wayland ext_background_effect, supported by KWin). The visible
# blur is still rendered by better-blur-dx; this only requests the area to blur.
background_blur          32

# Colors (background/foreground/cursor/selection/color0..15) come from
# `theme-wallpaper.conf`, generated by the Material You chain (see
# docs/material-you.md). A hardcoded palette here would be overridden by that
# include anyway, so it is deliberately not duplicated.

# --- Cursor ---
cursor_shape              beam
cursor_shape_unfocused    beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
window_padding_width      25
cursor_blink_interval     0.5 ease-in-out
cursor_beam_thickness     1.6

# cursor_trail_color       #c2c1ff  # none = cursor color



include theme-wallpaper.conf
