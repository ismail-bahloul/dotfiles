# ===========================================================================
# kitty.conf — portable copy
#
# No distro, compositor or hardware assumption. The machine repo pulls its
# colors from a Material You include (theme-wallpaper.conf); that file does not
# exist elsewhere, so this copy deliberately has no include and keeps kitty's
# builtin colors. Add your own below if you want a palette.
# ===========================================================================

# --- Font ------------------------------------------------------------------
# kitty falls back to its builtin monospace (with a log warning) when the family
# is absent, so this line is safe on a machine without the Nerd Font. See
# docs/install.md in the dotfiles repository for the distro-agnostic font
# install.
font_family              JetBrains Mono Nerd Font
font_size                10.0
adjust_line_height       0

# --- Transparency + blur ---------------------------------------------------
# Compositor-dependent: KWin and recent wlroots compositors honour
# ext_background_effect; elsewhere `background_blur` is simply a no-op.
background_opacity       0.93
dynamic_background_opacity yes
background_blur          32

# --- Cursor ----------------------------------------------------------------
cursor_shape              beam
cursor_shape_unfocused    beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
window_padding_width      25
cursor_blink_interval     0.5 ease-in-out
cursor_beam_thickness     1.6

# --- Bell ------------------------------------------------------------------
enable_audio_bell        no
visual_bell_duration     0.12
window_alert_on_bell     yes
bell_on_tab              no

# --- Tab bar (bottom) ------------------------------------------------------
# Shape/style only: colors come from the palette (builtin here).
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      round
tab_bar_align            start
active_tab_font_style    bold
inactive_tab_font_style  normal

# --- Machine-specific overrides --------------------------------------------
# The machine layer ships ~/.config/kitty/local.conf (wallpaper palette, per-host
# tweaks). globinclude is silent when the file is absent, so this is safe on a
# plain userspace install.
globinclude local.conf
