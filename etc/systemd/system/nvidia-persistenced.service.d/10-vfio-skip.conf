# Installed by run_once_11-boot-tuning.sh (dotfiles) -- see that script, step 7.
#
# On the VFIO boot entry the dGPU is driven by vfio-pci, not nvidia, so the
# bridge can gate its rail and the GPU settles in D3cold. nvidia-persistenced
# has nothing to do on that boot, but each start still loads the `nvidia`
# module, whose probe momentarily powers the GPU back up before failing:
#
#     NVRM: GPU 0000:01:00.0 is already bound to vfio-pci.
#     NVRM: No NVIDIA devices probed.
#
# Skip it on that entry. The condition is the vfio entry's own marker: keep the
# id list in sync with `.add-vfio-entry` (same `vfio-pci.ids=` string). On every
# other boot the word is absent and the unit runs as before.
#
# Detail: myomen15/power-config-audit.md -> "The other boot entry already does it".
[Unit]
ConditionKernelCommandLine=!vfio-pci.ids=10de:249d,10de:228b
