# Drop the plymouth hook from the initramfs.
#
# Plymouth is a boot splash and the machine boots without it: `quiet` already
# keeps the kernel messages off. Removing the hook kills plymouth-switch-root
# (~665 ms inside the initrd) and keeps its binaries and theme out of the image.
# `plymouth.enable=0` on the kernel cmdline (see /etc/default/limine) makes the
# userspace units skip as well, so neither half of Plymouth runs.
#
# The base HOOKS line is defined in /etc/mkinitcpio.conf and drop-ins are sourced
# after it. Note that `${HOOKS[@]/plymouth/}` is NOT enough: it substitutes the
# pattern inside each element, so the `plymouth` element becomes an empty string
# and mkinitcpio then fails with "Hook '' cannot be found" -- the element has to
# be dropped, not blanked.
_hooks=()
for _h in "${HOOKS[@]}"; do
  [ "$_h" = "plymouth" ] || _hooks+=("$_h")
done
HOOKS=("${_hooks[@]}")
unset _hooks _h
