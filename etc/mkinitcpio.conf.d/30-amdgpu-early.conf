# Force the amdgpu driver into the initramfs MODULES so the AMD iGPU gets early
# KMS (the internal panel is driven by amdgpu).
#
# Without this entry amdgpu is only bound by udev coldplug in the real root. On
# this machine that happens ~2.3 s after switch-root, inside a window where
# *nothing* logs (neither the kernel nor systemd) until the first `amdgpu` line.
# During that gap Plymouth (splash) and anything else that needs a DRM node is
# stalled. With early KMS the DRM device exists before switch-root.
#
# amdgpu.ko is already copied into the image by the `kms` hook; this only makes
# systemd-modules-load pull it in during the initrd. The NVIDIA dGPU is a
# separate device (bound to vfio-pci or nvidia depending on the Limine entry)
# and is not affected.
MODULES+=(amdgpu)
